<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182b2a">
  <title>Forest Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>FOREST RUNNER</h1>
      <p>画面の左右を押し続けて移動・ダブルタップでジャンプ</p>
    </header>

    <section class="frame" aria-label="Forest Runner game">
      <canvas id="game" width="320" height="180"></canvas>
      <div id="startOverlay" class="overlay">
        <div class="panel">
          <strong>FOREST RUNNER</strong>
          <span>タップしてスタート</span>
        </div>
      </div>
    </section>

    <div class="help">
      <span>← 左側を長押し</span>
      <span>ダブルタップ：ジャンプ</span>
      <span>右側を長押し →</span>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
